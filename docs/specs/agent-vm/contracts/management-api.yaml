openapi: 3.1.0
info:
  title: Agent VM Management API
  version: 1.0.0
  description: |
    Same-origin browser API for the built-in Agent VM management console.
    This contract is separate from the protocol-4 client and control API.
servers:
  - url: /api/v1
    description: Same-origin API served by the installed Agent VM product.
tags:
  - name: Session
  - name: Overview
  - name: VMs
  - name: Images
  - name: Operations
  - name: Audit
  - name: System
security:
  - forwardAuth: []
    webSession: []
paths:
  /session:
    get:
      tags: [Session]
      operationId: getManagementSession
      security:
        - forwardAuth: []
      summary: Establish the browser session and return its administrator context
      responses:
        "200":
          description: Authenticated administrator context and CSRF token.
          headers:
            Set-Cookie:
              description: Opaque session cookie; Secure, HttpOnly, SameSite=Strict, Path=/, Max-Age equal to the configured session TTL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementSession"
        default:
          $ref: "#/components/responses/Problem"

  /overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: Read the current capacity, admission, pressure and source freshness summary
      responses:
        "200":
          description: Current read-only overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
              examples:
                synthetic:
                  summary: Synthetic data with an unverified pressure observation
                  externalValue: ./management/examples/overview.json
        default:
          $ref: "#/components/responses/Problem"

  /vms:
    get:
      tags: [VMs]
      operationId: listManagedVMs
      summary: List existing Agent session VMs
      parameters:
        - name: state
          in: query
          description: Repeat to select more than one lifecycle state.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/VMState"
          style: form
          explode: true
        - name: session_id
          in: query
          schema:
            type: string
            minLength: 1
        - name: image_fingerprint
          in: query
          schema:
            $ref: "#/components/schemas/Fingerprint"
        - name: lease_state
          in: query
          schema:
            type: string
            enum: [effective, expired, absent, unknown]
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated managed VM inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMPage"
              examples:
                synthetic:
                  summary: Synthetic VM inventory
                  externalValue: ./management/examples/vms-page.json
        default:
          $ref: "#/components/responses/Problem"

  /vms/{task_id}:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      tags: [VMs]
      operationId: getManagedVM
      summary: Read one existing Agent session VM
      responses:
        "200":
          description: Current VM state and allowed action names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedVM"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{task_id}/actions/preview:
    parameters:
      - $ref: "#/components/parameters/TaskID"
      - $ref: "#/components/parameters/Origin"
    post:
      tags: [VMs]
      operationId: previewVMAction
      summary: Preview one fixed, supported VM action
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMActionPreviewRequest"
      responses:
        "200":
          description: Impact preview and a short-lived confirmation token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPreview"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{task_id}/actions:
    parameters:
      - $ref: "#/components/parameters/TaskID"
      - $ref: "#/components/parameters/Origin"
    post:
      tags: [VMs]
      operationId: submitVMAction
      summary: Submit a confirmed VM action as a durable operation
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMActionRequest"
            examples:
              restart:
                summary: Synthetic restart action request
                externalValue: ./management/examples/vm-action-request.json
      responses:
        "202":
          description: The durable operation is accepted or an identical prior operation is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Problem"

  /images:
    get:
      tags: [Images]
      operationId: listManagedImages
      summary: List managed image versions and their references
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [available, verifying, retired, failed]
        - name: architecture
          in: query
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated image catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePage"
              examples:
                synthetic:
                  summary: Synthetic image catalog, including a preserved legacy default
                  externalValue: ./management/examples/images-page.json
        default:
          $ref: "#/components/responses/Problem"

  /images/{fingerprint}:
    parameters:
      - $ref: "#/components/parameters/FingerprintPath"
    get:
      tags: [Images]
      operationId: getManagedImage
      summary: Read one immutable image and all reference classes
      responses:
        "200":
          description: Current image verification, default and reference state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImage"
        default:
          $ref: "#/components/responses/Problem"

  /images/imports:
    post:
      tags: [Images]
      operationId: startImageImport
      summary: Start an import from an allowlisted source or a bounded local upload
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageImportRequest"
            examples:
              localUpload:
                summary: Synthetic local package import request
                externalValue: ./management/examples/image-import-request.json
              splitLocalUpload:
                summary: Synthetic split package import request
                externalValue: ./management/examples/image-import-split-request.json
      responses:
        "202":
          description: Durable import operation; local uploads await one content stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Problem"

  /images/imports/{operation_id}/content:
    parameters:
      - $ref: "#/components/parameters/OperationID"
      - $ref: "#/components/parameters/Origin"
    put:
      tags: [Images]
      operationId: uploadImageImportContent
      summary: Stream the declared bytes for an existing local image import operation
      description: The stream is accepted once, must match the declared size and is never resumable.
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        description: Use one octet-stream body for unified packages or exactly one metadata and one rootfs part for split packages.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, rootfs]
              properties:
                metadata:
                  type: string
                  format: binary
                rootfs:
                  type: string
                  format: binary
      responses:
        "202":
          description: Upload was accepted for verification or the same operation is already processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Problem"

  /images/default/preview:
    post:
      tags: [Images]
      operationId: previewDefaultImageChange
      summary: Preview the effect of selecting a new default image
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultImagePreviewRequest"
      responses:
        "200":
          description: Preview bound to the current default-selection version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPreview"
        default:
          $ref: "#/components/responses/Problem"

  /images/default:
    post:
      tags: [Images]
      operationId: selectDefaultImage
      summary: Select an already verified managed image for new sessions
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultImageRequest"
      responses:
        "202":
          description: Default-selection operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Problem"

  /images/{fingerprint}/retire/preview:
    parameters:
      - $ref: "#/components/parameters/FingerprintPath"
      - $ref: "#/components/parameters/Origin"
    post:
      tags: [Images]
      operationId: previewImageRetirement
      summary: Preview retirement of an image version
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetPreviewRequest"
      responses:
        "200":
          description: Retirement impact and bound confirmation token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPreview"
        default:
          $ref: "#/components/responses/Problem"

  /images/{fingerprint}/retire:
    parameters:
      - $ref: "#/components/parameters/FingerprintPath"
      - $ref: "#/components/parameters/Origin"
    post:
      tags: [Images]
      operationId: retireManagedImage
      summary: Retire an image so it cannot be selected for new sessions
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedMutationRequest"
      responses:
        "202":
          description: Retirement operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Problem"

  /images/{fingerprint}/delete/preview:
    parameters:
      - $ref: "#/components/parameters/FingerprintPath"
      - $ref: "#/components/parameters/Origin"
    post:
      tags: [Images]
      operationId: previewImageDeletion
      summary: Preview deletion and show every blocking image reference
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetPreviewRequest"
      responses:
        "200":
          description: Deletion impact and bound confirmation token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPreview"
        default:
          $ref: "#/components/responses/Problem"

  /images/{fingerprint}/delete:
    parameters:
      - $ref: "#/components/parameters/FingerprintPath"
      - $ref: "#/components/parameters/Origin"
    post:
      tags: [Images]
      operationId: deleteManagedImage
      summary: Delete an unreferenced, non-default image
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedMutationRequest"
      responses:
        "202":
          description: Image deletion operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Problem"

  /operations:
    get:
      tags: [Operations]
      operationId: listOperations
      summary: List durable management operations
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [awaiting_upload, queued, running, reconciling, succeeded, failed, outcome_unknown]
        - name: action
          in: query
          schema:
            type: string
            minLength: 1
        - name: target_id
          in: query
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated operation history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationPage"
              examples:
                synthetic:
                  summary: Synthetic in-progress operation
                  externalValue: ./management/examples/operation.json
        default:
          $ref: "#/components/responses/Problem"

  /operations/{operation_id}:
    parameters:
      - $ref: "#/components/parameters/OperationID"
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Read an operation by its durable identity
      responses:
        "200":
          description: Current phase, outcome and safe result or error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Problem"

  /audit:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Query administrator audit events
      parameters:
        - name: actor
          in: query
          schema:
            type: string
            minLength: 1
        - name: operation_id
          in: query
          schema:
            type: string
            format: uuid
        - name: target_id
          in: query
          schema:
            type: string
            minLength: 1
        - name: action
          in: query
          schema:
            type: string
            minLength: 1
        - name: from
          in: query
          description: Inclusive UTC RFC 3339 lower bound.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive UTC RFC 3339 upper bound.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated, redacted audit history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
              examples:
                synthetic:
                  summary: Synthetic administrator action audit event
                  externalValue: ./management/examples/audit-page.json
        default:
          $ref: "#/components/responses/Problem"

  /system:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Read installed product, component readiness and maintenance state
      responses:
        "200":
          description: Read-only system status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
              examples:
                synthetic:
                  summary: Synthetic system status
                  externalValue: ./management/examples/system.json
        default:
          $ref: "#/components/responses/Problem"

  /system/maintenance/preview:
    post:
      tags: [System]
      operationId: previewMaintenance
      summary: Preview a supported maintenance operation
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenancePreviewRequest"
      responses:
        "200":
          description: Impact preview and short-lived confirmation token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPreview"
        default:
          $ref: "#/components/responses/Problem"

  /system/maintenance:
    post:
      tags: [System]
      operationId: submitMaintenance
      summary: Submit a confirmed drain, reconcile or garbage-collection action
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - forwardAuth: []
          webSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceRequest"
      responses:
        "202":
          description: Durable maintenance operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    forwardAuth:
      type: apiKey
      in: header
      name: X-Forwarded-User
      description: >-
        Set only by the configured reverse proxy after stripping browser-supplied
        identity headers. The Web process accepts it only on the trusted proxy
        Unix socket with the configured peer UID.
    webSession:
      type: apiKey
      in: cookie
      name: agent_vm_session
      description: Opaque browser session cookie; it is not an identity credential.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound token returned by GET /session.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured external origin for every POST or PUT.
      schema:
        type: string
        format: uri
    Query:
      name: q
      in: query
      description: Bounded literal search over documented display and identity fields.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Maximum number of returned rows; defaults to 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
        minLength: 1
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    FingerprintPath:
      name: fingerprint
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Fingerprint"
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: A structured, field-whitelisted API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            staleTarget:
              summary: Synthetic stale-target conflict
              externalValue: ./management/examples/error.json
  schemas:
    Fingerprint:
      type: string
      pattern: "^[a-f0-9]{64}$"
      description: Immutable lower-case SHA-256 image fingerprint.
    DecimalBytes:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      description: Non-negative decimal byte count encoded as a string to preserve integer precision in JavaScript.
    ManagementSession:
      type: object
      additionalProperties: false
      required: [subject, capabilities, csrf_token, expires_at]
      properties:
        subject:
          type: string
          minLength: 1
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [read, operate, manage_images, maintain_system]
        csrf_token:
          type: string
          minLength: 32
        expires_at:
          type: string
          format: date-time
    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, next_cursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: [string, "null"]
    SourceFreshness:
      type: object
      additionalProperties: false
      required: [name, state, observed_at, stale_after_seconds]
      properties:
        name:
          type: string
          minLength: 1
        state:
          type: string
          enum: [available, stale, missing, failed, unverified]
        observed_at:
          type: [string, "null"]
          format: date-time
        stale_after_seconds:
          type: integer
          minimum: 1
        safe_code:
          type: [string, "null"]
    ObservedBytes:
      type: object
      additionalProperties: false
      required: [state, value_bytes, observed_at]
      properties:
        state:
          type: string
          enum: [available, stale, missing, failed, unverified]
        value_bytes:
          oneOf:
            - $ref: "#/components/schemas/DecimalBytes"
            - type: "null"
        observed_at:
          type: [string, "null"]
          format: date-time
    ObservedNumber:
      type: object
      additionalProperties: false
      required: [state, value, observed_at]
      properties:
        state:
          type: string
          enum: [available, stale, missing, failed, unverified]
        value:
          type: [number, "null"]
        observed_at:
          type: [string, "null"]
          format: date-time
    ObservedBoolean:
      type: object
      additionalProperties: false
      required: [state, value, observed_at]
      properties:
        state:
          type: string
          enum: [available, stale, missing, failed, unverified]
        value:
          type: [boolean, "null"]
        observed_at:
          type: [string, "null"]
          format: date-time
    Overview:
      type: object
      additionalProperties: false
      required: [resource_version, observed_at, admission, capacity, pressure, task_counts, sources]
      properties:
        resource_version:
          type: string
          minLength: 1
        observed_at:
          type: string
          format: date-time
        admission:
          type: object
          additionalProperties: false
          required: [ready, draining, reasons]
          properties:
            ready:
              type: [boolean, "null"]
            draining:
              type: [boolean, "null"]
            reasons:
              type: array
              items:
                type: string
        capacity:
          type: object
          additionalProperties: false
          required: [logical_cpu_remaining_vcpu, ct_cpu_capacity_vcpu, logical_memory_remaining, ct_memory_available, physical_disk_available]
          properties:
            logical_cpu_remaining_vcpu:
              $ref: "#/components/schemas/ObservedNumber"
            ct_cpu_capacity_vcpu:
              $ref: "#/components/schemas/ObservedNumber"
            logical_memory_remaining:
              $ref: "#/components/schemas/ObservedBytes"
            ct_memory_available:
              $ref: "#/components/schemas/ObservedBytes"
            physical_disk_available:
              $ref: "#/components/schemas/ObservedBytes"
        pressure:
          type: object
          additionalProperties: false
          required: [cpu_some_avg10, cpu_full_avg10, cpu_startup_pressure_threshold_percent, cpu_startup_blocked, memory_pressure]
          properties:
            cpu_some_avg10:
              $ref: "#/components/schemas/ObservedNumber"
            cpu_full_avg10:
              $ref: "#/components/schemas/ObservedNumber"
            cpu_startup_pressure_threshold_percent:
              $ref: "#/components/schemas/ObservedNumber"
            cpu_startup_blocked:
              $ref: "#/components/schemas/ObservedBoolean"
            memory_pressure:
              $ref: "#/components/schemas/ObservedBoolean"
        task_counts:
          type: object
          additionalProperties: false
          required: [active, preparing, cached, closing, deleting, failed, absent]
          properties:
            active: { type: integer, minimum: 0 }
            preparing: { type: integer, minimum: 0 }
            cached: { type: integer, minimum: 0 }
            closing: { type: integer, minimum: 0 }
            deleting: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            absent: { type: integer, minimum: 0 }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceFreshness"
    VMState:
      type: string
      enum: [preparing, active, cached, closing, deleting, failed, absent]
    ManagedVM:
      type: object
      additionalProperties: false
      required: [task_id, session_id, generation, resource_version, state, native_state, guest_availability, image, resources, lease, port_mappings, updated_at]
      properties:
        task_id:
          type: string
        session_id:
          type: string
        generation:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        resource_version:
          type: string
        state:
          $ref: "#/components/schemas/VMState"
        native_state:
          type: string
          enum: [running, stopped, absent, transitional, unknown]
        guest_availability:
          type: string
          enum: [ready, unavailable, unknown]
        image:
          type: object
          additionalProperties: false
          required: [fingerprint, version_label]
          properties:
            fingerprint:
              $ref: "#/components/schemas/Fingerprint"
            version_label:
              type: [string, "null"]
        resources:
          type: object
          additionalProperties: false
          required: [cpu_vcpu, memory_bytes, disk_bytes]
          properties:
            cpu_vcpu:
              type: [number, "null"]
              minimum: 0
            memory_bytes:
              oneOf:
                - $ref: "#/components/schemas/DecimalBytes"
                - type: "null"
            disk_bytes:
              oneOf:
                - $ref: "#/components/schemas/DecimalBytes"
                - type: "null"
        lease:
          type: object
          additionalProperties: false
          required: [state, expires_at]
          properties:
            state:
              type: string
              enum: [effective, expired, absent, unknown]
            expires_at:
              type: [string, "null"]
              format: date-time
        port_mappings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, protocol, host_port, guest_port]
            properties:
              name: { type: string }
              protocol: { type: string, enum: [tcp, udp] }
              host_port: { type: integer, minimum: 1, maximum: 65535 }
              guest_port: { type: integer, minimum: 1, maximum: 65535 }
        last_error:
          oneOf:
            - $ref: "#/components/schemas/SafeError"
            - type: "null"
        updated_at:
          type: string
          format: date-time
        allowed_actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [restart, resize, release, destroy, port_add, port_remove]
    VMPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ManagedVM"
        page:
          $ref: "#/components/schemas/PageInfo"
    ImageReferenceCounts:
      type: object
      additionalProperties: false
      required: [default, active, cached, releasing, pending_creation, verification]
      properties:
        default: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        cached: { type: integer, minimum: 0 }
        releasing: { type: integer, minimum: 0, description: Tasks in closing, deleting or failed cleanup states that still pin the image. }
        pending_creation: { type: integer, minimum: 0 }
        verification: { type: integer, minimum: 0 }
    ManagedImage:
      type: object
      additionalProperties: false
      required: [fingerprint, resource_version, version_label, architecture, instance_type, source, state, verification, is_default, default_compatibility, references, created_at]
      properties:
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
        resource_version:
          type: string
        version_label:
          type: [string, "null"]
        architecture:
          type: string
        instance_type:
          type: string
          const: container
        source:
          type: object
          additionalProperties: false
          required: [kind, source_id]
          properties:
            kind:
              type: string
              enum: [trusted_remote, local_upload, legacy_config]
            source_id:
              type: [string, "null"]
        state:
          type: string
          enum: [available, verifying, retired, failed]
        verification:
          type: object
          additionalProperties: false
          required: [integrity, suitability, findings]
          properties:
            integrity:
              type: string
              enum: [not_checked, running, passed, failed, legacy_unverified]
            suitability:
              type: string
              enum: [not_assessed, running, passed, failed]
            findings:
              type: array
              items:
                type: string
                enum: [fingerprint_mismatch, unsupported_architecture, unsupported_instance_type, missing_runtime, missing_sync_tool, guest_not_ready, insufficient_staging_space, validation_failed]
        is_default:
          type: boolean
        default_compatibility:
          type: string
          enum: [none, legacy_unverified]
        references:
          $ref: "#/components/schemas/ImageReferenceCounts"
        created_at:
          type: string
          format: date-time
    ImagePage:
      type: object
      additionalProperties: false
      required: [items, page, default_fingerprint, selection_version, catalog_version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImage"
        page:
          $ref: "#/components/schemas/PageInfo"
        default_fingerprint:
          oneOf:
            - $ref: "#/components/schemas/Fingerprint"
            - type: "null"
        selection_version:
          type: string
        catalog_version:
          type: string
    VMActionPreviewRequest:
      type: object
      additionalProperties: false
      required: [action, expected_generation, target_version, parameters]
      properties:
        action:
          type: string
          enum: [restart, resize, release, destroy, port_add, port_remove]
        expected_generation:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        target_version:
          type: string
          minLength: 1
          maxLength: 256
        parameters:
          $ref: "#/components/schemas/VMActionParameters"
    VMActionRequest:
      type: object
      additionalProperties: false
      required: [operation_id, reason, target_version, action, expected_generation, parameters, confirmation_token]
      properties:
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 512
        target_version:
          type: string
          minLength: 1
          maxLength: 256
        action:
          type: string
          enum: [restart, resize, release, destroy, port_add, port_remove]
        expected_generation:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        parameters:
          $ref: "#/components/schemas/VMActionParameters"
        confirmation_token:
          type: string
          minLength: 32
    VMActionParameters:
      type: object
      additionalProperties: false
      properties:
        cpu_vcpu:
          type: number
          exclusiveMinimum: 0
        memory_bytes:
          $ref: "#/components/schemas/DecimalBytes"
        disk_bytes:
          $ref: "#/components/schemas/DecimalBytes"
        live:
          type: boolean
        allow_restart:
          type: boolean
        port_name:
          type: string
          minLength: 1
          maxLength: 64
        protocol:
          type: string
          enum: [tcp, udp]
        host_port:
          type: [integer, "null"]
          minimum: 1
          maximum: 65535
        guest_port:
          type: integer
          minimum: 1
          maximum: 65535
    ActionPreview:
      type: object
      additionalProperties: false
      required: [target_version, confirmation_token, expires_at, impact]
      properties:
        target_version:
          type: string
        confirmation_token:
          type: string
          minLength: 32
        expires_at:
          type: string
          format: date-time
        impact:
          type: object
          additionalProperties: false
          required: [summary_code, affected_session_count, affected_image_references, changes]
          properties:
            summary_code:
              type: string
              minLength: 1
            affected_session_count:
              type: integer
              minimum: 0
            affected_image_references:
              $ref: "#/components/schemas/ImageReferenceCounts"
            changes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code: { type: string, minLength: 1 }
                  count: { type: [integer, "null"], minimum: 0 }
                  value: { type: [string, "null"], maxLength: 256 }
    TargetPreviewRequest:
      type: object
      additionalProperties: false
      required: [target_version]
      properties:
        target_version:
          type: string
          minLength: 1
          maxLength: 256
    DefaultImagePreviewRequest:
      type: object
      additionalProperties: false
      required: [fingerprint, target_version]
      properties:
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
        target_version:
          type: string
          minLength: 1
    ConfirmedMutationRequest:
      type: object
      additionalProperties: false
      required: [operation_id, reason, target_version, confirmation_token]
      properties:
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 512
        target_version:
          type: string
          minLength: 1
          maxLength: 256
        confirmation_token:
          type: string
          minLength: 32
    DefaultImageRequest:
      type: object
      additionalProperties: false
      required: [operation_id, reason, target_version, fingerprint, confirmation_token]
      properties:
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 512
        target_version:
          type: string
          minLength: 1
          maxLength: 256
        fingerprint:
          $ref: "#/components/schemas/Fingerprint"
        confirmation_token:
          type: string
          minLength: 32
    ImageImportRequest:
      type: object
      additionalProperties: false
      required: [operation_id, reason, target_version, source]
      properties:
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 512
        target_version:
          type: string
          minLength: 1
          maxLength: 256
        version_label:
          type: string
          minLength: 1
          maxLength: 128
        source:
          oneOf:
            - $ref: "#/components/schemas/TrustedRemoteImageSource"
            - $ref: "#/components/schemas/LocalImageUploadSource"
    TrustedRemoteImageSource:
      type: object
      additionalProperties: false
      required: [kind, source_id, expected_fingerprint]
      properties:
        kind:
          const: trusted_remote
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        expected_fingerprint:
          $ref: "#/components/schemas/Fingerprint"
    LocalImageUploadSource:
      oneOf:
        - $ref: "#/components/schemas/LocalUnifiedImageUploadSource"
        - $ref: "#/components/schemas/LocalSplitImageUploadSource"
    LocalUnifiedImageUploadSource:
      type: object
      additionalProperties: false
      required: [kind, format, expected_sha256, expected_size_bytes]
      properties:
        kind:
          const: local_upload
        format:
          const: unified
        expected_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        expected_size_bytes:
          $ref: "#/components/schemas/DecimalBytes"
    LocalSplitImageUploadSource:
      description: Each payload part is length- and SHA-256-bound before upload; the configured byte ceiling applies to the sum of both payloads.
      type: object
      additionalProperties: false
      required: [kind, format, metadata, rootfs]
      properties:
        kind:
          const: local_upload
        format:
          const: split
        metadata:
          $ref: "#/components/schemas/ImageUploadPart"
        rootfs:
          $ref: "#/components/schemas/ImageUploadPart"
    ImageUploadPart:
      type: object
      additionalProperties: false
      required: [expected_sha256, expected_size_bytes]
      properties:
        expected_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        expected_size_bytes:
          $ref: "#/components/schemas/DecimalBytes"
    OperationTarget:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [vm, image, image_catalog, system]
        id:
          type: string
          minLength: 1
    SafeError:
      type: object
      additionalProperties: false
      required: [code, phase, retryable]
      properties:
        code:
          type: string
          enum:
            - authentication_required
            - administrator_required
            - csrf_invalid
            - origin_invalid
            - invalid_request
            - invalid_state
            - stale_target
            - operation_conflict
            - not_found
            - unsupported_action
            - permission_denied
            - source_not_allowed
            - upload_too_large
            - staging_capacity_low
            - fingerprint_mismatch
            - image_not_applicable
            - image_referenced
            - default_image_required
            - capacity_unverified
            - admission_denied
            - resource_insufficient
            - watermarks_unreachable
            - precondition_required
            - authority_unavailable
            - rate_limited
            - sqlite_unavailable
            - lease_expired
            - task_not_active
            - draining
            - mapping_unverified
            - cleanup_incomplete
            - resource_unverified
            - startup_reconcile_required
            - internal_error
        phase:
          oneOf:
            - $ref: "#/components/schemas/ErrorPhase"
            - type: "null"
        retryable:
          type: boolean
        operation_id:
          type: [string, "null"]
          format: uuid
        safe_fields:
          type: object
          additionalProperties: false
          properties:
            current_target_version:
              type: [string, "null"]
            maximum_upload_bytes:
              oneOf:
                - $ref: "#/components/schemas/DecimalBytes"
                - type: "null"
            affected_session_count:
              type: [integer, "null"]
              minimum: 0
            affected_references:
              $ref: "#/components/schemas/ImageReferenceCounts"
            imported_fingerprint:
              $ref: "#/components/schemas/Fingerprint"
            expected_fingerprint:
              $ref: "#/components/schemas/Fingerprint"
            cleanup:
              type: string
              enum: [verified, unverified, blocked_catalog_unverified, backend_unavailable]
            retry_after_seconds:
              type: [integer, "null"]
              minimum: 0
    OperationResult:
      type: object
      additionalProperties: false
      properties:
        image_fingerprint:
          oneOf:
            - $ref: "#/components/schemas/Fingerprint"
            - type: "null"
        default_fingerprint:
          oneOf:
            - $ref: "#/components/schemas/Fingerprint"
            - type: "null"
        affected_session_count:
          type: [integer, "null"]
          minimum: 0
        effect:
          type: [string, "null"]
          enum: [changed, unchanged, stopped, destroyed, verified, deleted, retired, completed, null]
    Operation:
      type: object
      additionalProperties: false
      required: [operation_id, action, status, phase, target, actor, reason, created_at, updated_at]
      properties:
        operation_id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/ManagementAction"
        status:
          type: string
          enum: [awaiting_upload, queued, running, reconciling, succeeded, failed, outcome_unknown]
        phase:
          $ref: "#/components/schemas/OperationPhase"
        target:
          $ref: "#/components/schemas/OperationTarget"
        actor:
          type: string
          minLength: 1
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          oneOf:
            - $ref: "#/components/schemas/OperationResult"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/SafeError"
            - type: "null"
    OperationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
        page:
          $ref: "#/components/schemas/PageInfo"
    AuditEvent:
      type: object
      additionalProperties: false
      required: [event_id, operation_id, action, actor, reason, target, outcome, phase, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/ManagementAction"
        actor:
          type: string
        reason:
          type: string
        target:
          $ref: "#/components/schemas/OperationTarget"
        outcome:
          type: string
          enum: [accepted, rejected, succeeded, failed, outcome_unknown]
        phase:
          $ref: "#/components/schemas/OperationPhase"
        occurred_at:
          type: string
          format: date-time
        safe_code:
          type: [string, "null"]
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          $ref: "#/components/schemas/PageInfo"
    SystemStatus:
      type: object
      additionalProperties: false
      required: [product_version, resource_version, state_capabilities, maintenance, components, sources]
      properties:
        product_version:
          type: string
          minLength: 1
        resource_version:
          type: string
          minLength: 1
        state_capabilities:
          description: Sorted, unique name@version markers supported by the installed database.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9-]*@[1-9][0-9]*$"
        maintenance:
          type: object
          additionalProperties: false
          required: [draining, reconciliation_pending, garbage_collection_pending]
          properties:
            draining:
              type: [boolean, "null"]
            reconciliation_pending:
              type: [integer, "null"]
              minimum: 0
            garbage_collection_pending:
              type: [integer, "null"]
              minimum: 0
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, state, version, observed_at]
            properties:
              name:
                type: string
                enum: [web, authority, observer]
              state:
                type: string
                enum: [ready, degraded, unavailable, unknown]
              version:
                type: [string, "null"]
              observed_at:
                type: [string, "null"]
                format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceFreshness"
    MaintenanceAction:
      type: string
      enum: [drain_enter, reconcile, gc]
    ManagementAction:
      type: string
      enum: [restart, resize, release, destroy, port_add, port_remove, image_import, default_image_select, image_retire, image_delete, drain_enter, reconcile, gc]
    OperationPhase:
      type: string
      enum: [queued, awaiting_upload, upload, integrity_check, image_import, suitability_check, reference_check, native_action, reconciliation, cleanup, completed]
    ErrorPhase:
      type: string
      enum: [authentication, authorization, request_validation, precondition, admission, awaiting_upload, upload, integrity_check, image_import, suitability_check, reference_check, native_action, reconciliation, cleanup, internal]
    MaintenancePreviewRequest:
      type: object
      additionalProperties: false
      required: [action, target_version, parameters]
      properties:
        action:
          $ref: "#/components/schemas/MaintenanceAction"
        target_version:
          type: string
          minLength: 1
        parameters:
          type: object
          additionalProperties: false
          properties:
            apply:
              const: true
            selection:
              type: string
              enum: [expired, released, eligible_cache]
    MaintenanceRequest:
      type: object
      additionalProperties: false
      required: [operation_id, reason, target_version, action, confirmation_token, parameters]
      properties:
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 512
        target_version:
          type: string
          minLength: 1
          maxLength: 256
        action:
          $ref: "#/components/schemas/MaintenanceAction"
        confirmation_token:
          type: string
          minLength: 32
        parameters:
          type: object
          additionalProperties: false
          properties:
            apply:
              const: true
            selection:
              type: string
              enum: [expired, released, eligible_cache]
    Problem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/SafeError"
