name: Notification smoke

on:
  workflow_dispatch:

jobs:
  config:
    name: Require Oidrune configuration
    runs-on: ubuntu-latest
    steps:
      - env:
          GATEWAY_URL: ${{ vars.OIDRUNE_GATEWAY_URL }}
          OIDC_AUDIENCE: ${{ vars.OIDRUNE_OIDC_AUDIENCE }}
        run: test -n "$GATEWAY_URL" && test -n "$OIDC_AUDIENCE"
  smoke:
    name: Oidrune notification smoke
    needs: config
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@4b5901a8827731ea06a05211dc6edf06e46783bc
    permissions:
      contents: none
      id-token: write
    with:
      outcome: failure
      summary: "Agent VM notification smoke: ${{ github.repository }} run=${{ github.run_id }} attempt=${{ github.run_attempt }}"
      on_gateway_failure: fail
      gateway_url: ${{ vars.OIDRUNE_GATEWAY_URL }}
      oidc_audience: ${{ vars.OIDRUNE_OIDC_AUDIENCE }}
