name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: patch, minor, major, or an explicit SemVer target
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

concurrency:
  # queue: max; release runs are serialized without canceling an active run.
  group: release
  cancel-in-progress: false

jobs:
  guest-images:
    uses: ./.github/workflows/image-preview.yml
    with:
      source_ref: ${{ github.sha }}
  release:
    name: Release
    needs: guest-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked Bun dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: guest-image-*
          path: ${{ runner.temp }}/agent-vm-release-images
      - name: Resolve, claim, build, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          AGENT_VM_RELEASE_IMAGE_INPUT: ${{ runner.temp }}/agent-vm-release-images
        run: bun run skills/agent-vm-ops/scripts/release.ts --target "${{ inputs.target }}"
      - name: Preserve release state for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-state-${{ github.run_id }}
          path: release-state/
          if-no-files-found: ignore
