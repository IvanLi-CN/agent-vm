name: Guest image preview

on:
  pull_request:
    paths:
      - "images/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/image-*.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: guest-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lock-check:
    name: Validate image lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run images:build -- --all --check
      - run: bun test images/tests

  build:
    name: Image ${{ matrix.language }} / ${{ matrix.variant }}
    needs: lock-check
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        language: [go, rust, java]
        variant: [privileged, unprivileged]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Prepare isolated Incus runner
        run: |
          # Ubuntu 24.04's original Incus 6.0.0 lacks the nesting/AppArmor fix
          # needed by current runc. Use the documented supported LTS binaries.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://pkgs.zabbly.com/key.asc -o /tmp/zabbly.asc
          test "$(gpg --show-keys --with-colons /tmp/zabbly.asc | awk -F: '$1 == "fpr" {print $10; exit}')" = 4EFC590696CB15B87C73A3AD82CC8797C838DCFD
          sudo install -m 0644 /tmp/zabbly.asc /etc/apt/keyrings/zabbly.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/zabbly.asc] https://pkgs.zabbly.com/incus/lts-7.0 noble main' | sudo tee /etc/apt/sources.list.d/zabbly-incus.list
          sudo apt-get update
          sudo apt-get install -y incus incus-client
          sudo systemctl start incus
          sudo incus version
          sudo incus admin init --minimal
          sudo incus network create avm-build-br ipv4.address=auto ipv6.address=none
          # Hosted runners also run Docker, whose FORWARD policy can block Incus.
          # Permit only traffic from this disposable build bridge and its replies.
          sudo iptables -I FORWARD -i avm-build-br -j ACCEPT
          sudo iptables -I FORWARD -o avm-build-br -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      - name: Build and verify image
        run: sudo env PATH="$PATH" AGENT_VM_IMAGE_NETWORK=avm-build-br AGENT_VM_IMAGE_SOURCE_REVISION="$(git rev-parse HEAD)" bun run images:build -- --profile "${{ matrix.language }}" --variant "${{ matrix.variant }}"
      - name: Verify exported checksums
        run: |
          cd dist && sha256sum -c agent-vm-ubuntu24-SHA256SUMS
          cd ..
          python3 images/scripts/verify_assets.py --directory dist --source-revision "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-image-${{ matrix.language }}-${{ matrix.variant }}
          path: dist/agent-vm-ubuntu24-*
          if-no-files-found: error
