name: CI (Main)
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: main
  cancel-in-progress: false
jobs:
  validation:
    name: Main portable validation
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore CI caches
        id: ci_cache
        uses: ./.github/actions/ci-cache-restore
        with:
          role: portable
      - name: Record validation runtimes
        run: |
          bun --version
          go version
          python3 --version
          git --version
          uname -s
      - name: Install locked Bun dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Web tests
        run: bun run test:web
      - name: Web demo browser tests
        if: matrix.os == 'ubuntu-latest'
        run: bun run test:e2e
      - name: Static demo build
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:demo
      - name: Storybook accessibility
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun run build-storybook
          bun run test:storybook:a11y
      - name: React Doctor
        run: bun run react-doctor:web
      - name: Go control tests
        working-directory: skills/agent-vm-ops/control
        run: go test -count=1 ./...
      - name: Go control vet
        run: go -C skills/agent-vm-ops/control vet ./...
      - name: Run repository checks
        run: bun run check
      - name: Run repository tests
        run: bun run test:repo
      - name: Build product packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          build_root="$(mktemp -d)"
          trap 'rm -rf "$build_root"' EXIT
          version="0.0.0-ci.${GITHUB_RUN_ID}"
          bun run skills/agent-vm-ops/scripts/build_product_release.ts --version "$version" --source-revision "$GITHUB_SHA" --target client --output "$build_root/client.tar"
          bun run skills/agent-vm-ops/scripts/build_product_release.ts --version "$version" --source-revision "$GITHUB_SHA" --target linux/amd64 --output "$build_root/amd64.tar"
          bun run skills/agent-vm-ops/scripts/build_product_release.ts --version "$version" --source-revision "$GITHUB_SHA" --target linux/arm64 --output "$build_root/arm64.tar"
      - name: Finalize CI caches
        if: always() && steps.ci_cache.outcome == 'success'
        uses: ./.github/actions/ci-cache-save
        with:
          state: ${{ steps.ci_cache.outputs.state }}
          role: portable
          publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && job.status == 'success' }}

  heavy:
    name: Main Skill and race validation
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore CI caches
        id: ci_cache
        uses: ./.github/actions/ci-cache-restore
        with:
          role: heavy
      - name: Record validation runtimes
        run: |
          bun --version
          go version
          python3 --version
          git --version
          uname -s
      - name: Install locked Bun dependencies
        run: bun install --frozen-lockfile
      - name: Run Skill tests
        run: bun run test:skills
      - name: Run Linux race tests
        working-directory: skills/agent-vm-ops/control
        run: go test -race -count=1 ./...
        if: matrix.os == 'ubuntu-latest'
      - name: Finalize CI caches
        if: always() && steps.ci_cache.outcome == 'success'
        uses: ./.github/actions/ci-cache-save
        with:
          state: ${{ steps.ci_cache.outputs.state }}
          role: heavy
          publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && job.status == 'success' }}

  main-gate:
    name: Main gate
    needs:
      - validation
      - heavy
    if: always()
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ubuntu-latest
    steps:
      - name: Enforce validation results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |-
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name, value in results.items():
              print(f"{name}: {value['result']}")
          assert all(value['result'] == 'success' for value in results.values()), results
          PY
