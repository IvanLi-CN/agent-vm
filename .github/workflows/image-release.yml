name: Guest image release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable product release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/image-preview.yml
    with:
      source_ref: ${{ inputs.tag }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: guest-image-*
          path: images
      - name: Verify and publish independent image assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir verified
          for directory in images/guest-image-*; do
            (cd "$directory" && sha256sum -c agent-vm-ubuntu24-SHA256SUMS)
            cat "$directory/agent-vm-ubuntu24-SHA256SUMS" >> verified/agent-vm-ubuntu24-SHA256SUMS
            cp "$directory"/*.tar.gz "$directory"/*.manifest.json "$directory"/*.sbom.json "$directory"/*.readiness.json verified/
          done
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"
          gh release upload "$RELEASE_TAG" verified/* --repo "$GH_REPO"
