name: CI (PR)
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  classify:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      macos: ${{ steps.classify.outputs.macos }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Classify changed paths
        id: classify
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: bun run bin/ci_classify.ts
      - name: Summarize classification
        env:
          FULL: ${{ steps.classify.outputs.full }}
          MACOS: ${{ steps.classify.outputs.macos }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          {
            echo "### CI path classification"
            echo "- full checks: ${FULL}"
            echo "- macOS checks: ${MACOS}"
            echo "- reason: ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"
  validation:
    name: PR portable validation
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os == 'macos-latest' && needs.classify.outputs.macos != 'true' && 'ubuntu-latest' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache-dependency-path: skills/agent-vm-ops/control/go.sum
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
      - name: Record validation runtimes
        run: |
          bun --version
          go version
          python3 --version
          git --version
          uname -s
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
      - name: Install locked Bun dependencies
        run: bun install --frozen-lockfile
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
      - name: Typecheck
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
        run: bun run typecheck
      - name: Web tests
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
        run: bun run test:web
      - name: Web demo browser tests
        if: matrix.os == 'ubuntu-latest'
        run: bun run test:e2e
      - name: Static demo build
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:demo
      - name: Storybook accessibility
        if: matrix.os == 'ubuntu-latest'
        run: |
          bun run build-storybook
          bun run test:storybook:a11y
      - name: React Doctor
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
        run: bun run react-doctor:web:ci
      - name: Go control tests
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
        working-directory: skills/agent-vm-ops/control
        run: go test -count=1 ./...
      - name: Run isolated rqlite integration tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: skills/agent-vm-ops/control
        env:
          RQLITE_VERSION: 10.5.2
          RQLITE_SHA256: 1a04a7c2c542e8e1c1347bd31af0fa9ef7043febb3c4d1806d36bc1702c6fa0f
        run: |
          set -Eeuo pipefail
          proof_dir="$(mktemp -d /tmp/agent-vm-rqlite.XXXXXX)"
          archive="${proof_dir}/rqlite.tar.gz"
          data_dir="${proof_dir}/rqlite-data"
          http_addr="127.0.0.1:4091"
          raft_addr="127.0.0.1:4092"
          base_url="http://${http_addr}"
          rqlite_asset="rqlite-v${RQLITE_VERSION}-linux-amd64.tar.gz"
          rqlite_url="https://github.com/rqlite/rqlite/releases/download/v${RQLITE_VERSION}/${rqlite_asset}"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" "${rqlite_url}"
          printf '%s  %s\n' "${RQLITE_SHA256}" "${archive}" | sha256sum --check --status -
          tar --extract --gzip --file "${archive}" --directory "${proof_dir}"
          rqlited="${proof_dir}/rqlite-v${RQLITE_VERSION}-linux-amd64/rqlited"
          mkdir -p "${data_dir}"
          "${rqlited}" -node-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -http-addr "${http_addr}" -raft-addr "${raft_addr}" "${data_dir}" >"${proof_dir}/rqlite.log" 2>&1 &
          rqlited_pid=$!
          cleanup() {
            kill -TERM "${rqlited_pid}" 2>/dev/null || true
            wait "${rqlited_pid}" 2>/dev/null || true
            rm -rf -- "${proof_dir}"
          }
          trap cleanup EXIT
          ready=0
          for _attempt in $(seq 1 120); do
            if ! kill -0 "${rqlited_pid}" 2>/dev/null; then
              cat "${proof_dir}/rqlite.log"
              exit 1
            fi
            if curl --fail --silent "${base_url}/status" | grep -q '"ready":true'; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [[ "${ready}" -ne 1 ]]; then
            cat "${proof_dir}/rqlite.log"
            exit 1
          fi
          printf '{"session_id":"ci-%s-%s","url":"%s","pid":%s,"data_dir":"%s"}\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${base_url}" "${rqlited_pid}" "${data_dir}" >"${proof_dir}/descriptor.json"
          AGENT_VM_SESSION_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          AGENT_VM_RQLITE_DESCRIPTOR="${proof_dir}/descriptor.json" \
            go test -race -count=1 ./internal/state -run '^TestRemote'
      - name: Go control vet
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
        run: go -C skills/agent-vm-ops/control vet ./...
      - name: Run repository checks
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
        run: bun run check
      - name: Validate blue-green deployment assets
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
        run: bun run skills/agent-vm-ops/scripts/validate_blue_green_deployment.ts
      - name: Run repository tests
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
        run: bun run test:repo
      - name: Build product packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          build_root="$(mktemp -d)"
          trap 'rm -rf "$build_root"' EXIT
          version="0.0.0-ci.${GITHUB_RUN_ID}"
          bun run skills/agent-vm-ops/scripts/build_product_release.ts --version "$version" --source-revision "$GITHUB_SHA" --target client --output "$build_root/client.tar"
          bun run skills/agent-vm-ops/scripts/build_product_release.ts --version "$version" --source-revision "$GITHUB_SHA" --target linux/amd64 --output "$build_root/amd64.tar"
          bun run skills/agent-vm-ops/scripts/build_product_release.ts --version "$version" --source-revision "$GITHUB_SHA" --target linux/arm64 --output "$build_root/arm64.tar"
  heavy:
    name: PR Skill and race validation
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os == 'macos-latest' && needs.classify.outputs.macos != 'true' && 'ubuntu-latest' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        if: (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true') && (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true')
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
        if: (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true') && (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true')
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache-dependency-path: skills/agent-vm-ops/control/go.sum
        if: (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true') && (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true')
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-1.4.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        if: (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true') && (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true')
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        if: (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true') && (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true')
      - name: Record validation runtimes
        run: |
          bun --version
          go version
          python3 --version
          git --version
          uname -s
        if: (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true') && (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true')
      - name: Install locked Bun dependencies
        run: bun install --frozen-lockfile
        if: (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true') && (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true')
      - name: Run Skill tests
        run: bun run test:skills
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true'
      - name: Run Linux race tests
        working-directory: skills/agent-vm-ops/control
        run: go test -race -count=1 ./...
        if: (matrix.os == 'ubuntu-latest') && (matrix.os == 'ubuntu-latest' || needs.classify.outputs.macos == 'true')
  pr-gate:
    name: PR gate
    needs:
      - classify
      - validation
      - heavy
    if: always()
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ubuntu-latest
    steps:
      - name: Enforce validation results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |-
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name, value in results.items():
              print(f"{name}: {value['result']}")
          assert all(value['result'] == 'success' for value in results.values()), results
          PY
      - name: Record platform disposition
        env:
          MACOS: ${{ needs.classify.outputs.macos }}
          REASON: ${{ needs.classify.outputs.reason }}
        run: 'echo "Platform validation: macOS=${MACOS}; reason=${REASON}. Non-macOS changes use skipped-success for macOS payload; Main retains all portable checks. Linux-only rqlite, packages and race remain on Ubuntu." >> "$GITHUB_STEP_SUMMARY"'
