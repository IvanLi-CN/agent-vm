name: Notify failed release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: notify-release-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify failed release
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Retrieve verified release state artifact
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$FAILED_RUN_ID" --name "release-state-${FAILED_RUN_ID}" --dir .failed-release-state || true
      - name: Build trusted release failure context
        env:
          FAILED_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_EVENT: ${{ github.event.workflow_run.event }}
          FAILED_REF: refs/heads/${{ github.event.workflow_run.head_branch }}
          FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_ACTOR: ${{ github.event.workflow_run.actor.login }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_STATE_ROOT: .failed-release-state
        run: bun run skills/agent-vm-ops/scripts/failure-notification.ts --class release-specific
