[Service]
User=agent-vm-server
SupplementaryGroups=agent-vm-server
Environment=INCUS_CONF=/etc/agent-vm-native/incus
Environment=SSL_CERT_FILE=/etc/agent-vm-native/tls/server-authority.crt
Environment=AGENT_VM_LEGACY_SLOT=%i
Environment=PATH=/opt/agent-vm-native/compat-incus:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
