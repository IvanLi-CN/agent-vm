[Unit]
Requires=agent-vm-deployd.socket agent-vm-deploy-host.socket agent-vm-slot-relay.socket
Sockets=agent-vm-deployd.socket
After=agent-vm-deployd.socket agent-vm-deploy-host.socket agent-vm-slot-relay.socket

[Service]
User=agent-vm-deploy
SupplementaryGroups=agent-vm-deploy
ReadWritePaths=
ReadWritePaths=/var/lib/agent-vm-native/slots /var/lib/agent-vm-native/routing /var/lib/agent-vm-native/deployment/runtime /var/lib/agent-vm-native/migration /var/lib/agent-vm-native/release-staging /run/agent-vm-native/deployd.lock
